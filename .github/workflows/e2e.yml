name: e2e

# Playwright browser journeys against the live production frontend
# (app.alphamoveai.co.uk). Verifies rendered pages — the layer healthcheck and
# smoke never see. Runs on a weekday schedule for monitoring, or on-demand
# (workflow_dispatch, or ./verify-prod.ps1 locally after a deploy). On failure
# the HTML report is uploaded as an artifact and GitHub sends a failure email.

on:
  schedule:
    - cron: '30 11 * * 1-5'   # weekdays 11:30 UTC, staggered after healthcheck
  workflow_dispatch:

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
