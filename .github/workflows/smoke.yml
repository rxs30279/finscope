name: smoke

# HTTP shape checks against the live production API (api.alphamoveai.co.uk),
# plus the email-digest dry-run. Installs only pytest+httpx (no app runtime,
# no DB), so a run is ~30s. Runs on a weekday schedule for monitoring, or
# on-demand (workflow_dispatch, or ./verify-prod.ps1 locally after a deploy).
# A failure goes red → GitHub sends the usual failure email.

on:
  schedule:
    # 07:00 / 13:00 / 18:00 UTC on weekdays — spread across the trading day.
    - cron: '0 7,13,18 * * 1-5'
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIGEST_CRON_TOKEN: ${{ secrets.DIGEST_CRON_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test deps
        run: pip install -r backend/requirements-dev.txt

      - name: Run smoke tests
        working-directory: backend
        run: python -m pytest smoke
