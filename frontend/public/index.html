<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpha Move AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinning {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    /* Scrollbar styling — hidden on sidebar, thin elsewhere */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3a3a3a;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a #0a0a0a;
    }

    aside::-webkit-scrollbar {
      display: none;
    }

    /* ── Responsive helpers ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .mobile-only {
      display: none !important;
    }

    .desktop-only {
      display: revert !important;
    }

    @media (max-width: 767px) {
      .mobile-only {
        display: revert !important;
      }

      .desktop-only {
        display: none !important;
      }

      body {
        overflow-x: hidden;
      }
    }

    /* Hamburger menu button */
    .hamburger {
      display: none;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    @media (max-width: 767px) {
      .hamburger {
        display: block;
      }
    }

    /* Mobile sidebar overlay */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: #0d0d0d;
      border-right: 1px solid #1e1e1e;
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
    }

    .sidebar-drawer.open {
      transform: translateX(0);
    }

    /* Mobile nav drawer */
    .nav-drawer {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      background: #0d0d0d;
      border-bottom: 1px solid #1e1e1e;
      z-index: 998;
      transform: translateY(-100%);
      transition: transform 0.25s ease;
      max-height: calc(100vh - 52px);
      overflow-y: auto;
    }

    .nav-drawer.open {
      transform: translateY(0);
    }

    /* Responsive table wrapper */
    .table-responsive {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 767px) {
      .table-responsive table {
        min-width: 600px;
      }
    }

    /* Card layout for mobile tables */
    .mobile-card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mobile-card-list .card-row {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 3px;
      padding: 10px 12px;
    }

    .mobile-card-list .card-row .field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-family: monospace;
      font-size: 11px;
    }

    .mobile-card-list .card-row .field .label {
      color: #666;
    }

    .mobile-card-list .card-row .field .value {
      color: #e5e5e5;
    }
  </style>
</head>

<body style="margin:0">
  <div id="root"></div>
</body>

</html>
